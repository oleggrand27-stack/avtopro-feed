name: Оновлення файлів для Автопро

on:
  schedule:
    - cron: "0 4,8,12,16 * * *"   # 6:00, 10:00, 14:00, 18:00 за Києвом (зимовий час)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python build.py
        env:
          PROM_FEED_URL: ${{ secrets.PROM_FEED_URL }}
          PROM_TOKEN: ${{ secrets.PROM_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
